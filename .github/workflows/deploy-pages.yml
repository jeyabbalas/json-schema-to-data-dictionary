name: Deploy demo to GitHub Pages

# Type-checks and tests, builds the (gitignored) browser bundle, the precomputed vector
# snapshots and the fixture-derived presets in CI, then publishes the demo/ site. One-time
# setup: repo Settings → Pages → Build and deployment → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        # Shared runners are ~3x slower than a laptop and node --test runs files in parallel;
        # the perf-smoke budgets (tests/perf-smoke.test.mjs) scale with this factor.
        run: npm test
        env:
          DD_PERF_SCALE: "3"

      - name: Build library bundle
        run: npm run build

      # Embedding the BCRPP fixture in Node takes a model download plus a minute of CPU; reuse
      # the snapshots (and the Hub download cache) until the inputs that define them change.
      - name: Cache precomputed vectors and the model download cache
        uses: actions/cache@v4
        with:
          path: |
            demo/vectors
            .cache/transformers
          key: vectors-${{ hashFiles('tests/fixtures/multiple_schema_2/**', 'scripts/build-vectors.mjs', 'scripts/build-snapshot.mjs', 'src/search/text.ts', 'src/search/snapshot.ts') }}

      - name: Precompute demo vectors
        run: npm run demo:vectors

      - name: Generate demo presets from fixtures
        run: npm run demo:presets

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          cp demo/index.html demo/styles.css demo/app.js demo/embed-worker.js demo/presets.js _site/
          if [ -d demo/vectors ]; then cp -r demo/vectors _site/vectors; fi
          cp dist/json-schema-data-dictionary.global.js _site/
          cp dist/json-schema-data-dictionary.global.js.map _site/ 2>/dev/null || true
          cp node_modules/exceljs/dist/exceljs.min.js _site/
          # Cache-bust the asset URLs. GitHub Pages serves everything with max-age=600, so
          # browsers keep the previous scripts and styles for up to 10 minutes after a deploy,
          # even across a normal reload. Versioned URLs make every deploy fetch fresh assets.
          v=${GITHUB_SHA::7}
          sed -i -E "s#(href|src)=\"([^\"?]+\.(css|js))\"#\1=\"\2?v=$v\"#g" _site/index.html
          test "$(grep -c "?v=$v" _site/index.html)" -ge 5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
